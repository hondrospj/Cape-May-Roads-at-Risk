name: Refresh observed flood history
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: cape-may-historical-data
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check baseline archive formulas and station safeguards
        run: node --test tests/refresh_history.test.cjs
      - name: Refresh the existing history from native Harbor USGS observations
        run: node tools/update_history.js
      - name: Commit actual refreshed data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flood_stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh observed Cape May Harbor flood history"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
